[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dbaudit"
version = "0.2.0"
description = "CIS-aligned configuration auditing for managed and self-hosted PostgreSQL, from a connection string alone"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Marcos Morris", email = "marck.morris.pro@gmail.com" }]
keywords = [
  "database",
  "postgresql",
  "cis-benchmark",
  "compliance",
  "sarif",
  "rds",
  "aurora",
  "cloud-sql",
  "sre",
  "devops",
  "audit",
  "ci",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Database",
  "Topic :: Security",
  "Topic :: System :: Monitoring",
]
dependencies = []

[project.optional-dependencies]
postgres = ["psycopg2-binary>=2.9"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "psycopg2-binary>=2.9"]

[project.scripts]
dbaudit = "dbaudit.cli:main"

[project.urls]
Homepage = "https://github.com/MarckMorris/dbaudit"
Issues = "https://github.com/MarckMorris/dbaudit/issues"

[tool.setuptools.packages.find]
include = ["dbaudit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
