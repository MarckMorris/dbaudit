name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Tests on Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest -v --cov=dbaudit --cov-report=term-missing

  smoke:
    name: Audit a live PostgreSQL
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: dbaudit
          POSTGRES_DB: dbaudit
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[postgres]"

      # A default postgres:16 container fails several checks by design, which is
      # the point: the audit has to produce real findings against a real server.
      - name: Audit the container
        run: |
          dbaudit "postgres://postgres:dbaudit@localhost:5432/dbaudit" \
            --sarif dbaudit.sarif \
            --sarif-location .github/workflows/ci.yml

      - name: Show the JSON report
        run: dbaudit "postgres://postgres:dbaudit@localhost:5432/dbaudit" --format json

      - name: Publish findings to the Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: dbaudit.sarif
          category: dbaudit
